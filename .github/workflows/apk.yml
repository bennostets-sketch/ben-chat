name: APK bauen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt erzeugen
        run: |
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'BENEOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "BenChat"
          include ':app'
          BENEOF
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'BENEOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          BENEOF
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'BENEOF'
          android.useAndroidX=true
          BENEOF
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'BENEOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'de.benytber.benchat'
            compileSdk 35
            defaultConfig { applicationId 'de.benytber.benchat'; minSdk 24; targetSdk 35; versionCode 6; versionName '1.5' }
            signingConfigs { release { storeFile file('../benchat.keystore'); storePassword 'benchat123'; keyAlias 'benchat'; keyPassword 'benchat123' } }
            buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          BENEOF
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'BENEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.WAKE_LOCK"/>
            <application android:label="BEN CHAT" android:icon="@android:drawable/sym_action_chat" android:usesCleartextTraffic="true"
                android:theme="@android:style/Theme.Black.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden"
                  android:windowSoftInputMode="adjustResize">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          BENEOF
          mkdir -p "$(dirname 'app/src/main/java/de/benytber/benchat/MainActivity.java')"
          cat > 'app/src/main/java/de/benytber/benchat/MainActivity.java' <<'BENEOF'
          package de.benytber.benchat;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.HashSet;

          public class MainActivity extends Activity {
            private WebView web, stream;
            private String playerHtml = "";
            private FrameLayout root;
            private final HashMap<String, WebView> tabViews = new HashMap<>();
            private final HashMap<String, String> tabUrls = new HashMap<>();

            private WebView makeWeb() {
              WebView w = new WebView(this);
              w.setBackgroundColor(Color.parseColor("#09090c"));
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setAllowFileAccess(true);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              w.setWebViewClient(new WebViewClient());
              // kein gruenes Android-Platzhalterbild bei leeren Video-/Audio-Playern (z. B. TTS-Overlays)
              w.setWebChromeClient(new WebChromeClient() { @Override public android.graphics.Bitmap getDefaultVideoPoster() { return android.graphics.Bitmap.createBitmap(1, 1, android.graphics.Bitmap.Config.ARGB_8888); } });
              return w;
            }

            // Bruecke fuer die Web-App: Twitch-Player nativ anzeigen (Twitch blockt das Einbetten auf http-Seiten)
            public class Bridge {
              @JavascriptInterface public void showPlayer(final String html, final int topCss, final int heightCss) {
                runOnUiThread(() -> {
                  float d = getResources().getDisplayMetrics().density;
                  FrameLayout.LayoutParams lp = (FrameLayout.LayoutParams) stream.getLayoutParams();
                  lp.topMargin = Math.round(topCss * d);
                  lp.height = Math.max(1, Math.round(heightCss * d));
                  stream.setLayoutParams(lp);
                  if (!html.equals(playerHtml)) { playerHtml = html; if (html.startsWith("http")) stream.loadUrl(html); else stream.loadDataWithBaseURL("https://benchat.app/", html, "text/html", "utf-8", null); }
                  stream.onResume();
                  stream.setVisibility(View.VISIBLE);
                });
              }
              // Eigene Tabs: jeder Tab ist ein eigenes Fenster (wie in OBS) - mit Ton, laeuft im Hintergrund weiter
              @JavascriptInterface public void syncTabs(final String json, final String activeId, final int topCss, final int heightCss) {
                runOnUiThread(() -> {
                  try {
                    JSONArray arr = new JSONArray(json);
                    HashSet<String> keep = new HashSet<>();
                    float d = getResources().getDisplayMetrics().density;
                    for (int i = 0; i < arr.length(); i++) {
                      JSONObject o = arr.getJSONObject(i);
                      String id = o.getString("id"), url = o.getString("url");
                      keep.add(id);
                      WebView w = tabViews.get(id);
                      if (w == null) { w = makeWeb(); w.setBackgroundColor(Color.BLACK); w.setVisibility(View.INVISIBLE); root.addView(w, new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)); tabViews.put(id, w); }
                      if (!url.equals(tabUrls.get(id))) { tabUrls.put(id, url); w.loadUrl(url); }
                      if (id.equals(activeId) && heightCss > 0) {
                        FrameLayout.LayoutParams lp = (FrameLayout.LayoutParams) w.getLayoutParams();
                        lp.topMargin = Math.round(topCss * d); lp.height = Math.round(heightCss * d); w.setLayoutParams(lp);
                        w.setVisibility(View.VISIBLE); w.bringToFront();
                      } else w.setVisibility(View.INVISIBLE);
                    }
                    for (String id : new ArrayList<>(tabViews.keySet())) if (!keep.contains(id)) { WebView w = tabViews.remove(id); tabUrls.remove(id); root.removeView(w); w.destroy(); }
                  } catch (Exception e) { }
                });
              }
              @JavascriptInterface public void hidePlayer() {
                runOnUiThread(() -> { stream.setVisibility(View.INVISIBLE); });
              }
            }

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              getWindow().setStatusBarColor(Color.parseColor("#09090c"));
              getWindow().setNavigationBarColor(Color.parseColor("#09090c"));
              root = new FrameLayout(this);
              root.setBackgroundColor(Color.parseColor("#09090c"));
              web = makeWeb();
              stream = makeWeb();
              stream.setBackgroundColor(Color.BLACK);
              stream.setVisibility(View.INVISIBLE);
              root.addView(web, new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
              root.addView(stream, new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, 1));
              web.addJavascriptInterface(new Bridge(), "BenApp");
              setContentView(root);
              if (b != null) web.restoreState(b); else web.loadUrl("file:///android_asset/start.html");
            }
            @Override protected void onSaveInstanceState(Bundle o) { super.onSaveInstanceState(o); web.saveState(o); }
            @Override public void onBackPressed() {
              if (stream.getVisibility() == View.VISIBLE) { web.evaluateJavascript("try{showTab('chat')}catch(e){}", null); return; }
              if (web.canGoBack()) web.goBack(); else super.onBackPressed();
            }
          }
          BENEOF
          mkdir -p "$(dirname 'app/src/main/assets/start.html')"
          cat > 'app/src/main/assets/start.html' <<'BENEOF'
          <!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <style>body{margin:0;background:#07070a;color:#f2f2f7;font:16px system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;min-height:100vh;padding:24px;box-sizing:border-box}
          h1{color:#ff2d95;font-weight:900;margin:0 0 6px}h1 span{color:#fff}p{color:#8b8b99;font-size:14px;line-height:1.5}
          input{width:100%;box-sizing:border-box;background:#1a1a22;border:1px solid #2a2a35;border-radius:10px;padding:14px;color:#fff;font-size:16px;margin:12px 0}
          button{width:100%;background:#ff2d95;border:0;border-radius:10px;padding:14px;color:#fff;font-weight:800;font-size:16px}
          #auto{display:none;text-align:center}</style></head><body>
          <div id="auto"><h1>BEN<span>CHAT</span></h1><p>Verbinde mit <b id="u"></b> …<br><br>Tippen zum Ändern</p></div>
          <div id="form"><h1>BEN<span>CHAT</span></h1><p>Adresse vom BEN-CHAT-Helfer eingeben, z. B. <b>192.168.178.20:3800</b> (PC im WLAN) oder die Adresse deines Servers.</p>
          <input id="i" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="192.168.178.20:3800"><button id="go">Verbinden</button></div>
          <script>
          let saved=''; try{saved=localStorage.getItem('server')||''}catch(e){}
          const norm=v=>{v=v.trim();if(!v)return'';if(!/^https?:\/\//.test(v))v='http://'+v;return v.replace(/\/+$/,'')};
          document.getElementById('i').value=saved.replace(/^https?:\/\//,'');
          document.getElementById('go').onclick=()=>{const v=norm(document.getElementById('i').value);if(!v)return;try{localStorage.setItem('server',v)}catch(e){}location.href=v+'/'};
          if(saved && !location.hash.includes('edit')){document.getElementById('form').style.display='none';const a=document.getElementById('auto');a.style.display='block';
           document.getElementById('u').textContent=saved;const t=setTimeout(()=>location.href=saved+'/',1500);
           a.onclick=()=>{clearTimeout(t);a.style.display='none';document.getElementById('form').style.display='block'}}
          </script></body></html>
          BENEOF
      - name: Signatur-Schluessel (gleich fuer alle Updates)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download signing -p benchat.keystore -R ${{ github.repository }}; then echo vorhanden; else
            keytool -genkeypair -keystore benchat.keystore -storepass benchat123 -keypass benchat123 -alias benchat -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=BEN CHAT, O=ben_ytber, C=DE"
            gh release create signing benchat.keystore -R ${{ github.repository }} -t Signatur -n "Signatur-Schluessel fuer App-Updates" --latest=false
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle :app:assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk BEN-CHAT.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BEN-CHAT-apk
          path: BEN-CHAT.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BEN CHAT ${{ github.run_number }}
          files: BEN-CHAT.apk
